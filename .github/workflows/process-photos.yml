name: Process photos (background removal)

# Every 10 minutes: if partners uploaded new photos, cut the device out of its background and put it on the
# standard one (tools/photo-background). When nothing is waiting the job stops after a few seconds.
# Needs the repository secret SUPABASE_SERVICE_ROLE_KEY (Supabase > Project settings > API keys > service_role).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: process-photos
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: https://akbgkwwjlskcfljwrlrx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Anything waiting?
        id: queue
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Secret SUPABASE_SERVICE_ROLE_KEY is not set, so photos cannot be processed yet."
            echo "work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          waiting=$(curl -fsS "$SUPABASE_URL/rest/v1/listing_photos?or=(process_status.eq.pending,process_status.eq.processing)&select=slot&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$waiting" = "[]" ]; then
            echo "Nothing to do."
            echo "work=false" >> "$GITHUB_OUTPUT"
          else
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.queue.outputs.work == 'true'

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.work == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/photo-background/requirements.txt

      - name: Cache the model (about 1 GB)
        if: steps.queue.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-birefnet-general-v1

      - name: Install
        if: steps.queue.outputs.work == 'true'
        run: pip install -r tools/photo-background/requirements.txt

      - name: Unit tests
        if: steps.queue.outputs.work == 'true'
        run: python -m unittest tools/photo-background/test_matting.py

      - name: Remove backgrounds
        if: steps.queue.outputs.work == 'true'
        run: python tools/photo-background/process.py run
